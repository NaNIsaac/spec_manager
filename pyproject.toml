[project]
name = "spec-manager"
version = "0.1.0"
description = "Parser for SPEC scan files and plotting scripts for rocking curves and peak broadening"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "scipy>=1.17.0",
]

[tool.ruff]
line-length = 100

# violations present when ruff became mandatory in CI; remove entries as they are fixed
[tool.ruff.lint.extend-per-file-ignores]
"main.py" = ["I001"]
"rocking_curve.py" = ["F841", "RUF059"]
"spec.py" = ["I001"]
