[project]
name = "splotter"
version = "0.1.2"
description = "Read SPEC scan files from the command line: scan lists, point values, metadata and mesh maps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [{ name = "Isaac Yong", email = "isaacyong@naver.com" }]
requires-python = ">=3.13"
keywords = ["SPEC", "X-ray diffraction", "synchrotron", "mesh scan", "rocking curve"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.0",
    "pandas>=3.0.1",
    "scipy>=1.17.0",
]

[project.scripts]
splotter = "splotter.cli:main"

[project.urls]
Homepage = "https://github.com/NaNIsaac/splotter"
Repository = "https://github.com/NaNIsaac/splotter"
Issues = "https://github.com/NaNIsaac/splotter/issues"
Changelog = "https://github.com/NaNIsaac/splotter/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
